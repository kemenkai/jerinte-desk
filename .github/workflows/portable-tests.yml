name: Portable packer tests

# The packer that unpacks and starts the Windows app (libs/portable) has its own unit
# tests, which neither ci.yml nor flutter-ci.yml runs. On Windows they also check that
# the Windows-only code (message boxes, the retry on sharing violations) compiles and
# behaves, which the other platforms cannot.

on:
  push:
    paths:
      - "libs/portable/**"
      - ".github/workflows/portable-tests.yml"
  pull_request:
    paths:
      - "libs/portable/**"
      - ".github/workflows/portable-tests.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # libs/portable is a member of the root workspace, which cargo loads whole;
          # libs/scrap and others depend on the hbb_common submodule.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          # what flutter-build.yml builds the Windows packer with
          toolchain: "1.75"
      - name: Placeholders for the payload a release build generates
        # include_bytes! needs them on Windows; the tests never read them.
        shell: bash
        run: touch libs/portable/data.bin libs/portable/app_metadata.toml
      - name: cargo test
        shell: bash
        working-directory: libs/portable
        run: cargo test --locked
